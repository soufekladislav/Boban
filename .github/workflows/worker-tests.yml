name: Boban worker safety tests
on:
  push:
    branches:
      - fix/worker-daily-sync-progress-20261114
      - feature/boban-autonomous-execution-eta-20261114
      - fix/visible-task-ledger-20261114
  pull_request:
    paths:
      - 'manage.py'
      - 'app.py'
      - 'worker_runtime.py'
      - 'sync_schedule.py'
      - 'connector_health.py'
      - 'tests/test_connector_health.py'
      - 'static/app.js'
      - 'tests/test_worker_runtime.py'
      - 'execution_overview.py'
      - 'job_monitor.py'
      - 'tests/test_job_monitor.py'
      - 'templates/partials/job_ledger.html'
      - 'templates/admin.html'
      - 'templates/actions.html'
      - 'tests/test_execution_overview.py'
      - 'templates/partials/boban_work.html'
      - 'tests/test_seo_queue_worker_22.py'
      - '.github/workflows/worker-tests.yml'
jobs:
  worker-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q app.py manage.py worker_runtime.py sync_schedule.py connector_health.py execution_overview.py job_monitor.py
      - name: Worker and scheduling tests
        run: |
          python -m unittest discover -s tests -p 'test_worker_runtime.py' -v
          python -m unittest discover -s tests -p 'test_connector_health.py' -v
          python -m unittest discover -s tests -p 'test_execution_overview.py' -v
          python -m unittest discover -s tests -p 'test_job_monitor.py' -v
          python -m unittest discover -s tests -p 'test_seo_queue_worker_22.py' -v
      - name: Existing regression suite
        run: python -m unittest discover -s tests -v
      - name: Jinja template syntax
        run: |
          python -c "from jinja2 import Environment, FileSystemLoader; e=Environment(loader=FileSystemLoader('templates')); [e.get_template(x) for x in ('admin.html','actions.html','partials/job_ledger.html','partials/boban_work.html')]"
      - name: Browser JavaScript syntax
        run: node --check static/app.js
